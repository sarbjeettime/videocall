[package]
name = "codechat"
version = "1.0.0"
edition = "2021"
description = "Private 2-person video chat rooms - Rust backend"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"

